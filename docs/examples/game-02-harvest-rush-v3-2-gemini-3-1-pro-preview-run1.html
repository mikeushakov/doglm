<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harvest Rush</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    canvas {
        background-color: #5c9e31;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        border: 4px solid #3e2723;
        border-radius: 10px;
    }
</style>
</head>
<body>
<canvas width="800" height="600" id="gameCanvas"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const baseCrops = [
        {x: 80, y: 120}, {x: 400, y: 70}, {x: 720, y: 120},
        {x: 180, y: 240}, {x: 620, y: 220},
        {x: 250, y: 400}, {x: 550, y: 380},
        {x: 120, y: 520}, {x: 680, y: 500},
        {x: 400, y: 470}
    ];

    const mudPatches = [
        {x: 200, y: 260, rx: 60, ry: 40},
        {x: 600, y: 240, rx: 70, ry: 45},
        {x: 400, y: 390, rx: 80, ry: 50}
    ];

    let state = 'PLAYING';
    let timer = 90;
    let lastTime = 0;
    
    let player = { x: 400, y: 550, baseSpeed: 220, radius: 15 };
    let dog = { x: 400, y: 300, vx: 0, vy: 0, dirTimer: 0, petted: false, heartLife: 0 };
    let crops = [];
    let popups = [];
    let keyMap = {};

    function initCrops() {
        crops = baseCrops.map(c => ({ x: c.x, y: c.y, harvested: false, golden: false }));
        let goldIndex = Math.floor(Math.random() * crops.length);
        crops[goldIndex].golden = true;
    }

    function resetGame() {
        state = 'PLAYING';
        timer = 90;
        player.x = 400;
        player.y = 550;
        dog.x = 400;
        dog.y = 300;
        dog.petted = false;
        dog.heartLife = 0;
        popups = [];
        initCrops();
    }

    function spawnPopup(x, y, text, color) {
        popups.push({ x, y, text, color, life: 1.5, maxLife: 1.5 });
    }

    function tryHarvest() {
        let actionDone = false;
        
        for (let c of crops) {
            if (!c.harvested) {
                let dist = Math.hypot(player.x - c.x, player.y - c.y);
                if (dist < 45) {
                    c.harvested = true;
                    actionDone = true;
                    if (c.golden) {
                        timer += 10;
                        spawnPopup(c.x, c.y, "+10s! Golden Crop!", "#FFD700");
                    } else {
                        spawnPopup(c.x, c.y, "Harvested!", "#FFFFFF");
                    }
                    break;
                }
            }
        }

        if (!actionDone && !dog.petted) {
            let dist = Math.hypot(player.x - dog.x, player.y - dog.y);
            if (dist < 50) {
                dog.petted = true;
                timer += 5;
                dog.heartLife = 2.0;
                spawnPopup(dog.x, dog.y - 20, "Good Boy! +5s", "#FF69B4");
                actionDone = true;
            }
        }

        if (crops.every(c => c.harvested)) {
            state = 'WON';
        }
    }

    window.addEventListener('keydown', e => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
            e.preventDefault();
        }
        keyMap[e.code] = true;
        if (e.code === 'Space' && state === 'PLAYING') tryHarvest();
        if (e.code === 'KeyR' && state !== 'PLAYING') resetGame();
    }, { passive: false });

    window.addEventListener('keyup', e => {
        keyMap[e.code] = false;
    });

    function updatePlaying(dt) {
        timer -= dt;
        if (timer <= 0) {
            timer = 0;
            state = 'LOST';
            return;
        }

        let dx = 0, dy = 0;
        if (keyMap['KeyW'] || keyMap['ArrowUp']) dy -= 1;
        if (keyMap['KeyS'] || keyMap['ArrowDown']) dy += 1;
        if (keyMap['KeyA'] || keyMap['ArrowLeft']) dx -= 1;
        if (keyMap['KeyD'] || keyMap['ArrowRight']) dx += 1;

        if (dx !== 0 && dy !== 0) {
            let len = Math.sqrt(dx*dx + dy*dy);
            dx /= len;
            dy /= len;
        }

        let inMud = mudPatches.some(m => {
            let nx = Math.pow((player.x - m.x) / m.rx, 2);
            let ny = Math.pow((player.y - m.y) / m.ry, 2);
            return (nx + ny) <= 1;
        });

        let currentSpeed = inMud ? player.baseSpeed * 0.4 : player.baseSpeed;
        
        player.x += dx * currentSpeed * dt;
        player.y += dy * currentSpeed * dt;
        player.x = Math.max(20, Math.min(WIDTH - 20, player.x));
        player.y = Math.max(20, Math.min(HEIGHT - 20, player.y));

        dog.dirTimer -= dt;
        if (dog.dirTimer <= 0) {
            let angle = Math.random() * Math.PI * 2;
            let speed = 20 + Math.random() * 30;
            dog.vx = Math.cos(angle) * speed;
            dog.vy = Math.sin(angle) * speed;
            dog.dirTimer = 1 + Math.random() * 2;
        }
        dog.x += dog.vx * dt;
        dog.y += dog.vy * dt;
        if (dog.x < 30 || dog.x > WIDTH - 30) dog.vx *= -1;
        if (dog.y < 30 || dog.y > HEIGHT - 30) dog.vy *= -1;
        dog.x = Math.max(30, Math.min(WIDTH - 30, dog.x));
        dog.y = Math.max(30, Math.min(HEIGHT - 30, dog.y));

        if (dog.heartLife > 0) dog.heartLife -= dt;

        for (let i = popups.length - 1; i >= 0; i--) {
            popups[i].life -= dt;
            popups[i].y -= 25 * dt;
            if (popups[i].life <= 0) {
                popups.splice(i, 1);
            }
        }
    }

    function drawDecorations() {
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, WIDTH-20, HEIGHT-20);
        ctx.strokeRect(16, 16, WIDTH-32, HEIGHT-32);
        ctx.fillStyle = '#654321';
        for(let x=10; x<WIDTH; x+=60) {
            ctx.beginPath(); ctx.arc(x, 10, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x, HEIGHT-10, 4, 0, Math.PI*2); ctx.fill();
        }
        for(let y=10; y<HEIGHT; y+=60) {
            ctx.beginPath(); ctx.arc(10, y, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(WIDTH-10, y, 4, 0, Math.PI*2); ctx.fill();
        }

        ctx.fillStyle = '#A9A9A9';
        ctx.fillRect(700, 30, 70, 40);
        ctx.fillStyle = '#1E90FF';
        ctx.fillRect(705, 35, 60, 30);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(710, 40, 25, 6);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.font = '12px sans-serif';
        ctx.fillText("WATER", 735, 55);

        mudPatches.forEach(m => {
            ctx.beginPath();
            ctx.ellipse(m.x, m.y, m.rx, m.ry, 0, 0, Math.PI*2);
            ctx.fillStyle = '#5C4033';
            ctx.fill();
        });

        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        baseCrops.forEach(c => {
            ctx.beginPath(); ctx.arc(c.x, c.y, 18, 0, Math.PI*2); ctx.fill();
        });
    }

    function drawCrops() {
        crops.forEach(c => {
            if (c.harvested) return;
            ctx.save();
            ctx.translate(c.x, c.y);

            ctx.shadowBlur = 15;
            ctx.shadowColor = c.golden ? '#FFD700' : '#7FFF00';

            ctx.fillStyle = c.golden ? '#FFD700' : '#32CD32';
            ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = c.golden ? '#FFF8DC' : '#228B22';
            ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();

            if (c.golden) {
                ctx.strokeStyle = '#B8860B';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(-6, 6); ctx.stroke();
            } else {
                ctx.strokeStyle = '#006400';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(4, -8); ctx.stroke();
            }

            ctx.restore();
        });
    }

    function drawEntities() {
        ctx.save();
        ctx.translate(dog.x, dog.y);
        if (dog.vx < 0) ctx.scale(-1, 1);
        ctx.fillStyle = '#cd853f';
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(10, -5, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8b4513';
        ctx.beginPath(); ctx.arc(14, -8, 3, 0, Math.PI*2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#cd853f';
        ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-14, -8); ctx.stroke();
        ctx.restore();

        if (dog.heartLife > 0) {
            ctx.fillStyle = '#FF69B4';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            let floatY = dog.y - 25 - (2 - dog.heartLife) * 10;
            ctx.fillText('❤', dog.x, floatY);
        }

        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath(); ctx.arc(player.x, player.y + 12, 10, 0, Math.PI*2); ctx.fill();
        
        ctx.fillStyle = '#3498db';
        ctx.beginPath(); ctx.arc(player.x, player.y, 14, 0, Math.PI*2); ctx.fill();
        
        ctx.fillStyle = '#f1c232';
        ctx.beginPath(); ctx.arc(player.x, player.y - 4, 10, 0, Math.PI*2); ctx.fill();
        
        ctx.fillStyle = '#d35400';
        ctx.fillRect(player.x - 16, player.y - 12, 32, 6);
        ctx.fillRect(player.x - 10, player.y - 20, 20, 10);
    }

    function drawHUD() {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(10, 10, 180, 40);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        let remaining = crops.filter(c => !c.harvested).length;
        ctx.fillText(`Crops: ${10 - remaining} / 10`, 20, 30);

        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(WIDTH - 150, 10, 140, 40);
        ctx.fillStyle = timer <= 10 ? '#FF4C4C' : '#FFF';
        ctx.textAlign = 'center';
        ctx.fillText(`Time: ${Math.ceil(timer)}`, WIDTH - 80, 30);

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(50, HEIGHT - 40, 700, 30);
        ctx.fillStyle = '#DDD';
        ctx.font = '16px monospace';
        ctx.fillText("Harvest all crops before time runs out. Move: WASD/Arrows. Harvest: Space", 400, HEIGHT - 25);

        popups.forEach(p => {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeText(p.text, p.x, p.y);
            ctx.fillStyle = p.color;
            ctx.fillText(p.text, p.x, p.y);
            ctx.globalAlpha = 1.0;
        });

        if (state !== 'PLAYING') {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (state === 'WON') {
                ctx.fillStyle = '#32CD32';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillText("Harvest complete!", 400, 250);
                ctx.fillText("You win!", 400, 310);
            } else {
                ctx.fillStyle = '#FF4C4C';
                ctx.font = 'bold 48px sans-serif';
                ctx.fillText("Sundown!", 400, 250);
                ctx.fillText("Time is up.", 400, 310);
            }
            
            ctx.fillStyle = '#FFF';
            ctx.font = '24px sans-serif';
            ctx.fillText("Press R to restart", 400, 400);
        }
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        let dt = (timestamp - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1;
        lastTime = timestamp;

        if (state === 'PLAYING') {
            updatePlaying(dt);
        }

        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        drawDecorations();
        drawCrops();
        drawEntities();
        drawHUD();

        requestAnimationFrame(gameLoop);
    }

    initCrops();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
