As per the requirements, here's the complete HTML file for the Night Watchman game:

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Watchman</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: monospace;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #333;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        const gameState = {
            player: { x: 400, y: 500, size: 20, speed: 3, color: '#4CAF50' },
            dog: { x: 380, y: 480, size: 15, color: '#FFC107', followDistance: 50 },
            doors: [
                { x: 100, y: 100, width: 30, height: 10, checked: false, progress: 0, color: '#F44336' },
                { x: 700, y: 200, width: 30, height: 10, checked: false, progress: 0, color: '#F44336' },
                { x: 200, y: 400, width: 30, height: 10, checked: false, color: '#F44336' },
                { x: 600, y: 500, width: 30, height: 10, checked: false, color: '#F44336' }
            ],
            walls: [
                { x: 0, y: 300, width: 300, height: 20 },
                { x: 500, y: 0, width: 20, height: 300 },
                { x: 300, y: 200, width: 200, height: 20 }
            ],
            decorations: [
                { x: 150, y: 200, type: 'crate', color: '#795548' },
                { x: 650, y: 100, type: 'desk', color: '#607D8B' },
                { x: 400, y: 300, type: 'plant', emoji: '🌿' }
            ],
            keys: { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false },
            gameWon: false,
            showInstructions: true,
            flashMessage: null,
            flashTimer: 0,
            coffee: { x: 700, y: 300, collected: false, size: 15, emoji: '☕' },
            alarms: [
                { x: 200, y: 150, triggered: false, radius: 50, cooldown: 0 },
                { x: 500, y: 450, triggered: false, radius: 50, cooldown: 0 }
            ],
            lastCheckTime: 0
        };

        // Input handling
        window.addEventListener('keydown', (e) => {
            if (e.key in gameState.keys) {
                gameState.keys[e.key] = true;
            }
            if (gameState.gameWon && e.key.toLowerCase() === 'r') {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key in gameState.keys) {
                gameState.keys[e.key] = false;
            }
        });

        // Collision detection
        function checkCollision(x, y, size, walls) {
            for (const wall of walls) {
                if (x + size > wall.x && x - size < wall.x + wall.width &&
                    y + size > wall.y && y - size < wall.y + wall.height) {
                    return true;
                }
            }
            return false;
        }

        // Check if player is near a door
        function checkNearDoor(player, door) {
            const distance = Math.sqrt(Math.pow(player.x - door.x, 2) + Math.pow(player.y - door.y, 2));
            return distance < 40;
        }

        // Update door check progress
        function updateDoorProgress() {
            const now = Date.now();
            if (now - gameState.lastCheckTime < 100) return; // Throttle updates

            for (const door of gameState.doors) {
                if (!door.checked) {
                    if (checkNearDoor(gameState.player, door)) {
                        door.progress += 0.05;
                        if (door.progress >= 1) {
                            door.checked = true;
                            door.color = '#4CAF50';
                            gameState.flashMessage = "Checked!";
                            gameState.flashTimer = 60;

                            // Check for win condition
                            if (gameState.doors.every(d => d.checked)) {
                                gameState.gameWon = true;
                            }
                        }
                    } else {
                        door.progress = 0;
                    }
                }
            }
            gameState.lastCheckTime = now;
        }

        // Update dog position
        function updateDog() {
            const dx = gameState.player.x - gameState.dog.x;
            const dy = gameState.player.y - gameState.dog.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > gameState.dog.followDistance) {
                const moveX = (dx / distance) * 2;
                const moveY = (dy / distance) * 2;

                const newX = gameState.dog.x + moveX;
                const newY = gameState.dog.y + moveY;

                if (!checkCollision(newX, newY, gameState.dog.size, gameState.walls)) {
                    gameState.dog.x = newX;
                    gameState.dog.y = newY;
                }
            }
        }

        // Update player position
        function updatePlayer() {
            let moveX = 0;
            let moveY = 0;

            if (gameState.keys.w || gameState.keys.ArrowUp) moveY -= gameState.player.speed;
            if (gameState.keys.s || gameState.keys.ArrowDown) moveY += gameState.player.speed;
            if (gameState.keys.a || gameState.keys.ArrowLeft) moveX -= gameState.player.speed;
            if (gameState.keys.d || gameState.keys.ArrowRight) moveX += gameState.player.speed;

            // Normalize diagonal movement
            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            // Check new position
            const newX = gameState.player.x + moveX;
            const newY = gameState.player.y + moveY;

            if (!checkCollision(newX, newY, gameState.player.size, gameState.walls)) {
                if (newX > gameState.player.size && newX < canvas.width - gameState.player.size) {
                    gameState.player.x = newX;
                }
                if (newY > gameState.player.size && newY < canvas.height - gameState.player.size) {
                    gameState.player.y = newY;
                }
            }

            // Check for coffee collection
            if (!gameState.coffee.collected) {
                const distance = Math.sqrt(Math.pow(gameState.player.x - gameState.coffee.x, 2) +
                                         Math.pow(gameState.player.y - gameState.coffee.y, 2));
                if (distance < 20) {
                    gameState.coffee.collected = true;
                    gameState.player.speed = 4.5;
                    gameState.flashMessage = "Speed boost!";
                    gameState.flashTimer = 60;
                }
            }

            // Check for alarms
            for (const alarm of gameState.alarms) {
                if (alarm.cooldown > 0) {
                    alarm.cooldown--;
                    continue;
                }

                const distance = Math.sqrt(Math.pow(gameState.player.x - alarm.x, 2) +
                                         Math.pow(gameState.player.y - alarm.y, 2));
                if (distance < alarm.radius && !alarm.triggered) {
                    alarm.triggered = true;
                    alarm.cooldown = 300;
                    gameState.flashMessage = "ALARM! Dog barks!";
                    gameState.flashTimer = 60;
                    // Make dog run to player
                    gameState.dog.followDistance = 10;
                }
            }
        }

        // Draw game elements
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw walls
            ctx.fillStyle = '#333';
            for (const wall of gameState.walls) {
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
            }

            // Draw decorations
            for (const decor of gameState.decorations) {
                ctx.fillStyle = decor.color;
                if (decor.type === 'crate') {
                    ctx.fillRect(decor.x, decor.y, 30, 30);
                } else if (decor.type === 'desk') {
                    ctx.fillRect(decor.x, decor.y, 60, 30);
                } else if (decor.type === 'plant') {
                    ctx.font = '24px Arial';
                    ctx.fillText(decor.emoji, decor.x, decor.y);
                }
            }

            // Draw coffee
            if (!gameState.coffee.collected) {
                ctx.font = '24px Arial';
                ctx.fillText(gameState.coffee.emoji, gameState.coffee.x, gameState.coffee.y);
            }

            // Draw doors
            for (const door of gameState.doors) {
                // Door frame
                ctx.fillStyle = '#555';
                ctx.fillRect(door.x - 5, door.y - 20, door.width + 10, door.height + 30);

                // Door
                ctx.fillStyle = door.color;
                ctx.fillRect(door.x, door.y, door.width, door.height);

                // Door indicator
                ctx.fillStyle = door.checked ? '#4CAF50' : '#F44336';
                ctx.beginPath();
                ctx.arc(door.x + door.width/2, door.y - 10, 5, 0, Math.PI * 2);
                ctx.fill();

                // Progress indicator
                if (!door.checked && checkNearDoor(gameState.player, door)) {
                    ctx.strokeStyle = '#FFEB3B';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(door.x + door.width/2, door.y - 10, 10, 0, Math.PI * 2 * door.progress);
                    ctx.stroke();
                }
            }

            // Draw alarms
            for (const alarm of gameState.alarms) {
                if (!alarm.triggered) {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
                    ctx.beginPath();
                    ctx.arc(alarm.x, alarm.y, alarm.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw dog
            ctx.fillStyle = gameState.dog.color;
            ctx.beginPath();
            ctx.arc(gameState.dog.x, gameState.dog.y, gameState.dog.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '12px Arial';
            ctx.fillText('🐶', gameState.dog.x - 6, gameState.dog.y + 4);

            // Draw player
            ctx.fillStyle = gameState.player.color;
            ctx.beginPath();
            ctx.arc(gameState.player.x, gameState.player.y, gameState.player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '20px Arial';
            ctx.fillText('👮', gameState.player.x - 10, gameState.player.y + 8);

            // Draw HUD
            ctx.fillStyle = '#FFF';
            ctx.font = '16px monospace';
            ctx.fillText(`Doors: ${gameState.doors.filter(d => d.checked).length} / ${gameState.doors.length}`, 20, 30);

            // Draw instructions
            if (gameState.showInstructions) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(100, 250, 600, 60);
                ctx.fillStyle = '#FFF';
                ctx.font = '20px monospace';
                ctx.fillText("Check all doors. Move: WASD/arrows. Stand near a door to check it.", 120, 280);
                ctx.fillText("Find coffee for speed boost. Avoid alarms!", 120, 310);
            }

            // Draw flash message
            if (gameState.flashTimer > 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(300, 200, 200, 40);
                ctx.fillStyle = '#FFF';
                ctx.font = '20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(gameState.flashMessage, 400, 230);
                ctx.textAlign = 'left';
                gameState.flashTimer--;
            }

            // Draw victory screen
            if (gameState.gameWon) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFF';
                ctx.font = '40px monospace';
                ctx.textAlign = 'center';
                ctx.fillText("All doors checked!", 400, 250);
                ctx.fillText("Shift complete!", 400, 300);
                ctx.font = '20px monospace';
                ctx.fillText("Press R to restart", 400, 350);
                ctx.textAlign = 'left';
            }
        }

        // Reset game state
        function resetGame() {
            gameState.player = { x: 400, y: 500, size: 20, speed: 3, color: '#4CAF50' };
            gameState.dog = { x: 380, y: 480, size: 15, color: '#FFC107', followDistance: 50 };
            gameState.doors = [
                { x: 100, y: 100, width: 30, height: 10, checked: false, progress: 0, color: '#F44336' },
                { x: 700, y: 200, width: 30, height: 10, checked: false, progress: 0, color: '#F44336' },
                { x: 200, y: 400, width: 30, height: 10, checked: false, color: '#F44336' },
                { x: 600, y: 500, width: 30, height: 10, checked: false, color: '#F44336' }
            ];
            gameState.coffee = { x: 700, y: 300, collected: false, size: 15, emoji: '☕' };
            gameState.alarms = [
                { x: 200, y: 150, triggered: false, radius: 50, cooldown: 0 },
                { x: 500, y: 450, triggered: false, radius: 50, cooldown: 0 }
            ];
            gameState.gameWon = false;
            gameState.showInstructions = true;
            setTimeout(() => { gameState.showInstructions = false; }, 5000);
        }

        // Game loop
        function gameLoop() {
            updatePlayer();
            updateDog();
            updateDoorProgress();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        resetGame();
        gameLoop();
    </script>
</body>
</html>
