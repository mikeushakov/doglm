<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Courier</title>
<style>
  html,body{margin:0;height:100%;background:#22303f;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}
  canvas{box-shadow:0 10px 40px rgba(0,0,0,.55);border-radius:8px;}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=800, H=600, DELIVER_R=40;

/* ---------------- state ---------------- */
let houses, player, dog, butterflies, popups, particles, letters, stamina, won, helpAlpha, time;
const keys={};

function makeHouses(){ return [
  {x:70,  y:92,  w:80, h:64, c:'#e8b04b', delivered:false},
  {x:650, y:92,  w:80, h:64, c:'#d97b6c', delivered:false},
  {x:92,  y:430, w:80, h:64, c:'#7fa8d9', delivered:false},
  {x:628, y:430, w:80, h:64, c:'#9b7fd9', delivered:false},
  {x:360, y:96,  w:80, h:64, c:'#6cbf84', delivered:false},
];}

function reset(){
  houses=makeHouses();
  player={x:400, y:545, speed:175, walk:0, moving:false, sprinting:false};
  dog={x:448, y:566, wag:0, excite:0, orbit:0, heartT:0, fx:0, fy:-1};
  butterflies=[
    {ax:300, ay:360, x:300, y:360, t:0, seed:0, c:'#e78fb7'},
    {ax:520, ay:215, x:520, y:215, t:0, seed:2, c:'#8fb7e7'},
    {ax:455, ay:475, x:455, y:475, t:0, seed:4, c:'#e7d38f'},
  ];
  popups=[]; particles=[]; letters=5; stamina=1; won=false; helpAlpha=1; time=0;
}
reset();

/* decorations (generated once) */
const tufts=[], flowers=[], flowerCols=['#ff8fa3','#ffd166','#c3a6ff','#ffffff'];
for(let i=0;i<60;i++) tufts.push({x:Math.random()*W, y:Math.random()*H});
for(let i=0;i<18;i++) flowers.push({x:20+Math.random()*(W-40), y:20+Math.random()*(H-40), c:flowerCols[i%4]});
const trees=[{x:252,y:150},{x:556,y:150},{x:246,y:505},{x:566,y:505},{x:752,y:210},{x:44,y:210}];
const bushes=[{x:150,y:246},{x:660,y:352},{x:300,y:430},{x:508,y:430}];
const groundGrad=ctx.createLinearGradient(0,0,0,H);
groundGrad.addColorStop(0,'#84bd66'); groundGrad.addColorStop(1,'#6da753');

/* ---------------- input ---------------- */
addEventListener('keydown', e=>{
  if(e.code.startsWith('Arrow')) e.preventDefault();
  keys[e.code]=true;
  if(e.repeat) return;
  if(!won){
    if(e.code==='KeyE') tryDeliver();
    if(e.code==='KeyF') tryPet();
  }
  if(e.code==='KeyR' && won) reset();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

/* ---------------- helpers ---------------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function pill(cx,cy,text){
  ctx.font='bold 12px sans-serif';
  const w=ctx.measureText(text).width+18;
  rr(cx-w/2,cy-11,w,22,11);
  ctx.fillStyle='rgba(20,20,20,.6)'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,cx,cy+1);
  ctx.textBaseline='alphabetic';
}
function distToRect(px,py,r){
  const nx=Math.max(r.x,Math.min(px,r.x+r.w));
  const ny=Math.max(r.y,Math.min(py,r.y+r.h));
  return Math.hypot(px-nx,py-ny);
}
function burst(x,y,n){
  const cols=['#ffd166','#9dff70','#ffffff','#ff9ec7','#8fd0ff'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=40+Math.random()*120;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.6+Math.random()*.5,max:1.1,r:2+Math.random()*2.5,c:cols[i%5]});
  }
}

/* ---------------- actions ---------------- */
function tryDeliver(){
  for(const h of houses){
    if(!h.delivered && distToRect(player.x,player.y,h)<=DELIVER_R){
      h.delivered=true; letters--;
      const cx=h.x+h.w/2;
      popups.push({x:cx,y:h.y-8,vy:-26,text:'Delivered!',c:'#9dff70',size:18,life:1.2,max:1.2});
      burst(cx,h.y,14);
      if(letters===0){ won=true; burst(player.x,player.y-10,40); }
      return;
    }
  }
}
function tryPet(){
  if(Math.hypot(player.x-dog.x,player.y-dog.y)<48){
    dog.excite=2.4; dog.heartT=0;
    popups.push({x:dog.x,y:dog.y-16,vy:-24,text:'Woof! ❤',c:'#ff9ec7',size:16,life:1.1,max:1.1});
  }
}

/* ---------------- update ---------------- */
function update(dt){
  time+=dt;
  if(!won) updatePlayer(dt);
  updateDog(dt);
  for(const b of butterflies) updateButterfly(b,dt);
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.life-=dt; p.y+=p.vy*dt; if(p.life<=0) popups.splice(i,1); }
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=240*dt; if(p.life<=0) particles.splice(i,1); }
  if(letters<5 && helpAlpha>0) helpAlpha=Math.max(0,helpAlpha-dt*0.7);
}
function updatePlayer(dt){
  const p=player;
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA']) dx--;
  if(keys['ArrowRight']||keys['KeyD']) dx++;
  if(keys['ArrowUp']||keys['KeyW']) dy--;
  if(keys['ArrowDown']||keys['KeyS']) dy++;
  p.moving=(dx!==0||dy!==0);
  p.sprinting=false;
  if(p.moving){
    const l=Math.hypot(dx,dy); dx/=l; dy/=l;
    let sp=p.speed;
    if((keys['ShiftLeft']||keys['ShiftRight'])&&stamina>0){ sp*=1.7; p.sprinting=true; stamina=Math.max(0,stamina-0.5*dt); }
    p.x+=dx*sp*dt; p.y+=dy*sp*dt;
    p.walk+=dt*(p.sprinting?15:10);
  }
  if(!p.sprinting) stamina=Math.min(1,stamina+0.35*dt);
  // houses are solid (circle vs wall rect)
  for(const h of houses){
    const rx=h.x, ry=h.y+10, rw=h.w, rh=h.h-10;
    const nx=Math.max(rx,Math.min(p.x,rx+rw));
    const ny=Math.max(ry,Math.min(p.y,ry+rh));
    const ox=p.x-nx, oy=p.y-ny, d2=ox*ox+oy*oy;
    if(d2>0 && d2<144){ const d=Math.sqrt(d2); p.x+=ox/d*(12-d); p.y+=oy/d*(12-d); }
  }
  p.x=Math.max(14,Math.min(W-14,p.x));
  p.y=Math.max(16,Math.min(H-16,p.y));
}
function updateDog(dt){
  const d=dog;
  d.wag+=dt*(d.excite>0?22:9);
  if(d.excite>0){ // happy zoomies around the player
    d.excite-=dt; d.orbit+=dt*7;
    const tx=player.x+Math.cos(d.orbit)*44, ty=player.y+Math.sin(d.orbit)*44;
    const k=Math.min(1,dt*12);
    d.x+=(tx-d.x)*k; d.y+=(ty-d.y)*k;
    d.heartT-=dt;
    if(d.heartT<=0){ d.heartT=0.5; popups.push({x:d.x,y:d.y-12,vy:-22,text:'❤',c:'#ff7eb0',size:13,life:.7,max:.7}); }
  }else{
    const dx=player.x-d.x, dy=player.y-d.y, dist=Math.hypot(dx,dy);
    if(dist>56){
      const sp=dist>200?300:155;
      const step=Math.min(sp*dt,dist-48);
      d.x+=dx/dist*step; d.y+=dy/dist*step;
    }
  }
  d.x=Math.max(12,Math.min(W-12,d.x));
  d.y=Math.max(12,Math.min(H-12,d.y));
  const fx=player.x-d.x, fy=player.y-d.y, l=Math.hypot(fx,fy)||1;
  d.fx=fx/l; d.fy=fy/l;
}
function updateButterfly(b,dt){
  b.t+=dt;
  const dx=b.x-player.x, dy=b.y-player.y, d=Math.hypot(dx,dy);
  if(d<80 && d>0){ b.x+=dx/d*80*dt; b.y+=dy/d*80*dt; } // flee the player
  else{
    const tx=b.ax+Math.sin(b.t*0.7+b.seed)*45, ty=b.ay+Math.cos(b.t*0.9+b.seed)*32;
    b.x+=(tx-b.x)*Math.min(1,dt*1.6);
    b.y+=(ty-b.y)*Math.min(1,dt*1.6);
  }
  b.x=Math.max(10,Math.min(W-10,b.x));
  b.y=Math.max(10,Math.min(H-10,b.y));
}

/* ---------------- draw ---------------- */
function drawPath(){
  ctx.fillStyle='#c9ad74';
  ctx.fillRect(368,248,64,H-248);
  ctx.fillRect(0,268,W,68);
  ctx.beginPath(); ctx.arc(400,302,50,0,7); ctx.fill();
  ctx.fillStyle='#dec98f';
  ctx.fillRect(374,254,52,H-254);
  ctx.fillRect(0,274,W,56);
  ctx.beginPath(); ctx.arc(400,302,44,0,7); ctx.fill();
}
function drawTree(t){
  ctx.fillStyle='#7a5230'; ctx.fillRect(t.x-4,t.y,8,16);
  ctx.fillStyle='#3f7d3a';
  for(const [ox,oy,r] of [[0,-10,15],[-11,-2,10],[11,-2,10]]){ ctx.beginPath(); ctx.arc(t.x+ox,t.y+oy,r,0,7); ctx.fill(); }
  ctx.fillStyle='rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(t.x-4,t.y-14,6,0,7); ctx.fill();
}
function drawBush(b){
  ctx.fillStyle='#4c8f46';
  for(const [ox,oy,r] of [[-7,2,8],[7,2,8],[0,-4,9]]){ ctx.beginPath(); ctx.arc(b.x+ox,b.y+oy,r,0,7); ctx.fill(); }
}
function drawHouse(h,i){
  const cx=h.x+h.w/2;
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(h.x+3,h.y+16,h.w,h.h-12);
  ctx.fillStyle=h.c; ctx.fillRect(h.x,h.y+14,h.w,h.h-14);
  ctx.fillStyle='#8a4b3a';
  ctx.beginPath(); ctx.moveTo(h.x-8,h.y+16); ctx.lineTo(cx,h.y-14); ctx.lineTo(h.x+h.w+8,h.y+16); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#d8ecff';
  ctx.fillRect(h.x+10,h.y+26,15,15); ctx.fillRect(h.x+h.w-25,h.y+26,15,15);
  ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1.5;
  ctx.strokeRect(h.x+10,h.y+26,15,15); ctx.strokeRect(h.x+h.w-25,h.y+26,15,15);
  ctx.fillStyle='#6b4226'; ctx.fillRect(cx-9,h.y+h.h-24,18,24);
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(cx+5,h.y+h.h-11,1.8,0,7); ctx.fill();
  ctx.textAlign='center';
  if(h.delivered){
    ctx.font='bold 14px sans-serif'; ctx.fillStyle='#2f9e44';
    ctx.fillText('✔',cx,h.y+h.h-30);
  }else{
    const bob=Math.sin(time*3+i*1.3)*3;
    ctx.font='22px sans-serif';
    ctx.fillText('📬',cx,h.y-20+bob);
    if(!won && distToRect(player.x,player.y,h)<=DELIVER_R)
      pill(cx,h.y-54,'Press E to deliver');
  }
}
function drawButterfly(b){
  const f=Math.abs(Math.sin(b.t*11));
  ctx.save(); ctx.translate(b.x,b.y);
  ctx.fillStyle=b.c;
  ctx.beginPath(); ctx.ellipse(-3,0,3.2,4.5*f+1,-.4,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,0,3.2,4.5*f+1,.4,0,7); ctx.fill();
  ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(0,-3.5); ctx.lineTo(0,3.5); ctx.stroke();
  ctx.restore();
}
function drawDog(){
  const d=dog;
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(d.x,d.y+8,11,4,0,0,7); ctx.fill();
  const w=Math.sin(d.wag)*5;
  ctx.strokeStyle='#7a4a22'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(d.x-d.fx*9,d.y-d.fy*6);
  ctx.lineTo(d.x-d.fx*16-w*d.fy, d.y-d.fy*14+w*d.fx); ctx.stroke();
  ctx.fillStyle='#b5773f';
  ctx.beginPath(); ctx.ellipse(d.x,d.y,11,8,0,0,7); ctx.fill();
  const hx=d.x+d.fx*10, hy=d.y+d.fy*6-3;
  ctx.beginPath(); ctx.arc(hx,hy,6.5,0,7); ctx.fill();
  ctx.fillStyle='#7a4a22';
  ctx.beginPath(); ctx.arc(hx-4,hy-4,2.6,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(hx+4,hy-4,2.6,0,7); ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(hx+d.fx*5,hy+d.fy*4,1.7,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(hx-1+d.fx*2,hy-2,1.1,0,7); ctx.fill();
}
function drawPlayer(){
  const p=player;
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(p.x,p.y+11,10,4,0,0,7); ctx.fill();
  const o=p.moving?Math.sin(p.walk)*3:0;
  ctx.fillStyle='#3a3f4b';
  ctx.fillRect(p.x-7,p.y+4+o,5,9);
  ctx.fillRect(p.x+2,p.y+4-o,5,9);
  ctx.fillStyle='#2f6fd0'; rr(p.x-9,p.y-8,18,15,5); ctx.fill();
  if(letters>0){
    ctx.fillStyle='#8a5a2b'; ctx.fillRect(p.x+7,p.y-4,7,10);
    ctx.fillStyle='#fff';    ctx.fillRect(p.x+8.5,p.y-2.5,4,3);
  }
  ctx.fillStyle='#f2c79b'; ctx.beginPath(); ctx.arc(p.x,p.y-14,7,0,7); ctx.fill();
  ctx.fillStyle='#1d4fa0';
  ctx.beginPath(); ctx.arc(p.x,p.y-16,7,Math.PI,0); ctx.fill();
  ctx.fillRect(p.x-8,p.y-17.5,16,3);
}
function drawHUD(){
  rr(10,10,178,62,10); ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textAlign='left';
  ctx.fillText('✉️ Letters: '+letters+' / 5',22,34);
  ctx.font='13px sans-serif'; ctx.fillText('⚡',22,56);
  ctx.fillStyle='rgba(255,255,255,.25)'; rr(44,47,120,9,4); ctx.fill();
  ctx.fillStyle=stamina>0.25?'#ffd166':'#ff7b6b';
  if(stamina>0.01) ctx.fillRect(45,48,118*stamina,7);
}
function render(){
  ctx.fillStyle=groundGrad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#5f9b4a'; ctx.lineWidth=1.5;
  for(const t of tufts){ ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(t.x-2,t.y-5); ctx.moveTo(t.x+2,t.y); ctx.lineTo(t.x+3,t.y-5); ctx.stroke(); }
  for(const f of flowers){
    ctx.fillStyle=f.c;
    for(const [ox,oy] of [[-2.5,0],[2.5,0],[0,-2.5],[0,2.5]]){ ctx.beginPath(); ctx.arc(f.x+ox,f.y+oy,2,0,7); ctx.fill(); }
    ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(f.x,f.y,1.6,0,7); ctx.fill();
  }
  drawPath();
  for(const b of bushes) drawBush(b);
  for(const t of trees) drawTree(t);
  for(let i=0;i<houses.length;i++) drawHouse(houses[i],i);
  for(const b of butterflies) drawButterfly(b);
  drawDog();
  if(!won && dog.excite<=0 && Math.hypot(player.x-dog.x,player.y-dog.y)<48)
    pill(dog.x,dog.y-26,'Press F to pet');
  drawPlayer();
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of popups){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.font='bold '+p.size+'px sans-serif'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.strokeText(p.text,p.x,p.y);
    ctx.fillStyle=p.c; ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
  drawHUD();
  if(helpAlpha>0 && !won){
    ctx.globalAlpha=helpAlpha;
    const txt='Deliver all 5 letters  ·  Move: WASD/Arrows  ·  Sprint: Shift  ·  Deliver: E  ·  Pet dog: F';
    ctx.font='bold 13px sans-serif';
    const w=ctx.measureText(txt).width+28;
    rr(400-w/2,566,w,24,12); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(txt,400,578);
    ctx.textBaseline='alphabetic'; ctx.globalAlpha=1;
  }
  if(won){
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
    rr(165,218,470,164,16); ctx.fillStyle='#fff7e6'; ctx.fill();
    ctx.strokeStyle='#e0b25f'; ctx.lineWidth=3; ctx.stroke();
    ctx.textAlign='center'; ctx.fillStyle='#3a2f22';
    ctx.font='bold 28px sans-serif'; ctx.fillText('🎉 All mail delivered! 🎉',400,268);
    ctx.font='bold 20px sans-serif'; ctx.fillText('You win!',400,308);
    ctx.font='15px sans-serif'; ctx.fillStyle='#7a6a55';
    ctx.fillText('Press R to play again',400,348);
  }
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
