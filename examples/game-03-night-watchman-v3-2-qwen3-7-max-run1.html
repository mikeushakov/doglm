<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Night Watchman</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b0f;height:100%;overflow:hidden;font-family:system-ui,sans-serif;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{background:#0a0a0a;display:block;border:1px solid #222;}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 800, H = 600;

  // Walls: rectangles. Outer walls form a border; inner walls divide the floor.
  const walls = [
    // outer
    {x:0,y:0,w:W,h:20},
    {x:0,y:H-20,w:W,h:20},
    {x:0,y:0,w:20,h:H},
    {x:W-20,y:0,w:20,h:H},
    // left vertical divider at x=220, with two gaps for doors
    {x:220,y:20,w:20,h:180},    // y 20-200
    // gap y 200-240 -> D1
    {x:220,y:240,w:20,h:160},   // y 240-400
    // gap y 400-440 -> D2
    {x:220,y:440,w:20,h:140},   // y 440-580
    // right vertical divider at x=560, one gap for D3
    {x:560,y:20,w:20,h:160},    // y 20-180
    // gap y 180-220 -> D3
    {x:560,y:220,w:20,h:360},   // y 220-580
    // horizontal wall at y=300 splits middle area (gap in middle for D4)
    {x:240,y:300,w:160,h:20},   // x 240-400
    // gap x 400-440 -> D4
    {x:440,y:300,w:120,h:20}    // x 440-560
  ];

  // Decorations (purely visual, not collidable)
  const decor = [
    {x:90,  y:90,  kind:'desk'},
    {x:400, y:80,  kind:'plant'},
    {x:680, y:100, kind:'crate'},
    {x:680, y:500, kind:'crate'},
    {x:340, y:500, kind:'desk'},
    {x:470, y:200, kind:'plant'},
    {x:120, y:320, kind:'plant'},
    {x:700, y:300, kind:'desk'}
  ];

  // Door templates (x,y is the center of the doorway gap)
  const doorTemplate = [
    {x:230, y:220, r:42},
    {x:230, y:420, r:42},
    {x:570, y:200, r:42},
    {x:420, y:310, r:42}
  ];

  // State
  let player, dog, doors, treats, footprints, popups, flashlightOn, gameTime, victory;
  const keys = {};

  function reset() {
    player = {x:400, y:545, r:10, speed:150, dirX:0, dirY:1, stamina:100, moving:false};
    dog    = {x:400, y:525, r:8,  fetching:null};
    doors  = doorTemplate.map(d=>({x:d.x, y:d.y, r:d.r, checked:false, progress:0, flash:0}));
    treats = [];
    footprints = [];
    popups = [];
    flashlightOn = true;
    gameTime = 0;
    victory = false;
  }
  reset();

  // Input
  window.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === 'r' && victory) reset();
    if (k === 'f') flashlightOn = !flashlightOn;
    if (k === 't' && !victory) throwTreat();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

  function throwTreat() {
    const speed = 260;
    const vx = player.dirX*speed, vy = player.dirY*speed;
    treats.push({
      x: player.x + player.dirX*16,
      y: player.y + player.dirY*16,
      vx, vy, life: 5, stopped:false
    });
  }

  // Collision: circle vs rectangle walls
  function circleHitsWall(cx, cy, r) {
    for (const w of walls) {
      const nx = Math.max(w.x, Math.min(cx, w.x + w.w));
      const ny = Math.max(w.y, Math.min(cy, w.y + w.h));
      const dx = cx - nx, dy = cy - ny;
      if (dx*dx + dy*dy < r*r) return true;
    }
    return false;
  }

  function tryMove(ent, dx, dy) {
    if (dx !== 0 && !circleHitsWall(ent.x + dx, ent.y, ent.r)) ent.x += dx;
    if (dy !== 0 && !circleHitsWall(ent.x, ent.y + dy, ent.r)) ent.y += dy;
    ent.x = Math.max(ent.r+1, Math.min(W-ent.r-1, ent.x));
    ent.y = Math.max(ent.r+1, Math.min(H-ent.r-1, ent.y));
  }

  // Main loop
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!victory) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    gameTime += dt;

    // ---- Player movement
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup'])    dy -= 1;
    if (keys['s'] || keys['arrowdown'])  dy += 1;
    if (keys['a'] || keys['arrowleft'])  dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    const len = Math.hypot(dx, dy);
    let spd = player.speed;
    if (len > 0) {
      dx /= len; dy /= len;
      player.dirX = dx; player.dirY = dy;
      if (keys['shift'] && player.stamina > 0) {
        spd *= 1.7;
        player.stamina = Math.max(0, player.stamina - 28*dt);
      } else {
        player.stamina = Math.min(100, player.stamina + 14*dt);
      }
      player.moving = true;
    } else {
      player.stamina = Math.min(100, player.stamina + 26*dt);
      player.moving = false;
    }
    tryMove(player, dx * spd * dt, dy * spd * dt);

    // ---- Footprints
    if (player.moving) {
      const last = footprints[footprints.length-1];
      if (!last || Math.hypot(last.x-player.x, last.y-player.y) > 12) {
        footprints.push({x:player.x, y:player.y, life:3.5});
      }
    }
    for (const f of footprints) f.life -= dt;
    footprints = footprints.filter(f => f.life > 0);

    // ---- Treats physics
    for (const t of treats) {
      if (!t.stopped) {
        t.x += t.vx * dt;
        t.y += t.vy * dt;
        t.vx *= Math.pow(0.05, dt);
        t.vy *= Math.pow(0.05, dt);
        if (circleHitsWall(t.x, t.y, 4) || Math.hypot(t.vx,t.vy) < 15) {
          t.stopped = true; t.vx = t.vy = 0;
        }
        if (t.x < 6 || t.x > W-6 || t.y < 6 || t.y > H-6) { t.stopped = true; }
      }
      t.life -= dt;
    }
    treats = treats.filter(t => t.life > 0);

    // ---- Dog AI: fetch nearest treat if close enough, else follow player
    let goalX = player.x - player.dirX*22;
    let goalY = player.y - player.dirY*22;
    let bestTarget = null, bestDist = 260;
    for (const t of treats) {
      const d = Math.hypot(t.x - dog.x, t.y - dog.y);
      if (d < bestDist) { bestDist = d; bestTarget = t; }
    }
    if (bestTarget) {
      goalX = bestTarget.x; goalY = bestTarget.y;
      dog.fetching = bestTarget;
      if (Math.hypot(bestTarget.x - dog.x, bestTarget.y - dog.y) < 10) {
        bestTarget.life = 0;
        dog.fetching = null;
        popups.push({x:dog.x, y:dog.y-14, text:'🦴 yum!', life:1.2});
      }
    } else {
      dog.fetching = null;
    }
    const ddx = goalX - dog.x, ddy = goalY - dog.y;
    const dlen = Math.hypot(ddx, ddy);
    if (dlen > 14) {
      const dogSpd = dog.fetching ? 180 : 115;
      tryMove(dog, (ddx/dlen)*dogSpd*dt, (ddy/dlen)*dogSpd*dt);
    }

    // ---- Popups
    for (const p of popups) { p.life -= dt; p.y -= 8*dt; }
    popups = popups.filter(p => p.life > 0);

    // ---- Door checking
    for (const door of doors) {
      if (door.checked) { door.flash = Math.max(0, door.flash - dt); continue; }
      const d = Math.hypot(door.x - player.x, door.y - player.y);
      if (d < door.r) {
        door.progress += dt;
        if (door.progress >= 2) {
          door.checked = true;
          door.progress = 2;
          door.flash = 0.8;
          popups.push({x:door.x, y:door.y-22, text:'✓ Checked!', life:1.8});
          const remaining = doors.filter(x=>!x.checked).length;
          if (remaining === 0) victory = true;
        }
      } else {
        door.progress = 0;
      }
    }
  }

  // ---- Rendering
  function render() {
    // Floor base
    ctx.fillStyle = '#161412';
    ctx.fillRect(0, 0, W, H);

    // Subtle floor grid
    ctx.strokeStyle = '#1f1c18';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Decorations
    for (const d of decor) drawDecor(d);

    // Walls
    for (const w of walls) {
      ctx.fillStyle = '#3c2f22';
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = '#24180e';
      ctx.lineWidth = 1;
      ctx.strokeRect(w.x+0.5, w.y+0.5, w.w-1, w.h-1);
    }

    // Footprints
    for (const f of footprints) {
      const a = Math.min(0.45, f.life * 0.15);
      ctx.fillStyle = `rgba(110,95,75,${a})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI*2); ctx.fill();
    }

    // Treats
    for (const t of treats) {
      ctx.fillStyle = '#e8c07a';
      ctx.beginPath(); ctx.arc(t.x, t.y, 4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#7a5520';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Doors
    for (const door of doors) {
      // door frame on floor
      const col = door.checked ? '#1e4a24' : '#4a1e1e';
      ctx.fillStyle = col;
      ctx.fillRect(door.x-18, door.y-18, 36, 36);
      ctx.strokeStyle = door.checked ? '#6edc6e' : '#ff8080';
      ctx.lineWidth = 2;
      ctx.strokeRect(door.x-18, door.y-18, 36, 36);
      // inner panel
      ctx.strokeStyle = door.checked ? 'rgba(110,220,110,0.5)' : 'rgba(255,130,130,0.5)';
      ctx.strokeRect(door.x-12, door.y-12, 24, 24);

      // indicator lamp (top-right near the door)
      const lx = door.x + 22, ly = door.y - 22;
      const lampCol = door.checked ? '#70ff70' : '#ff5050';
      // glow
      const gg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 16);
      gg.addColorStop(0, door.checked ? 'rgba(110,255,110,0.55)' : 'rgba(255,70,70,0.55)');
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(lx, ly, 16, 0, Math.PI*2); ctx.fill();
      // bulb
      ctx.fillStyle = lampCol;
      ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI*2); ctx.fill();

      // checked flash burst
      if (door.flash > 0) {
        const gr = ctx.createRadialGradient(door.x, door.y, 4, door.x, door.y, 60);
        gr.addColorStop(0, `rgba(180,255,150,${door.flash*0.6})`);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(door.x, door.y, 60, 0, Math.PI*2); ctx.fill();
      }

      // progress ring
      if (!door.checked && door.progress > 0) {
        ctx.strokeStyle = '#ffe27a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(door.x, door.y - 28, 9, -Math.PI/2, -Math.PI/2 + Math.PI*2*(door.progress/2));
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath(); ctx.arc(door.x, door.y - 28, 9, 0, Math.PI*2); ctx.stroke();
      }
    }

    // Player
    ctx.fillStyle = '#e6c36c';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#7a5f2a';
    ctx.lineWidth = 2;
    ctx.stroke();
    // facing dot
    ctx.fillStyle = '#2a1a08';
    ctx.beginPath();
    ctx.arc(player.x + player.dirX*6, player.y + player.dirY*6, 3, 0, Math.PI*2);
    ctx.fill();
    // sprint sparkle
    if (keys['shift'] && player.moving && player.stamina > 0) {
      ctx.strokeStyle = 'rgba(255,230,120,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r+3, 0, Math.PI*2);
      ctx.stroke();
    }

    // Dog
    // body
    ctx.fillStyle = '#8b5a2b';
    ctx.beginPath(); ctx.arc(dog.x, dog.y, dog.r, 0, Math.PI*2); ctx.fill();
    // ears
    ctx.fillStyle = '#3a2418';
    ctx.beginPath(); ctx.arc(dog.x-5, dog.y-5, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(dog.x+5, dog.y-5, 3, 0, Math.PI*2); ctx.fill();
    // nose
    ctx.fillStyle = '#1a0a04';
    ctx.beginPath(); ctx.arc(dog.x, dog.y+3, 2, 0, Math.PI*2); ctx.fill();

    // Darkness / flashlight overlay
    if (flashlightOn) {
      const g = ctx.createRadialGradient(player.x, player.y, 40, player.x, player.y, 240);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.78)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    } else {
      const g = ctx.createRadialGradient(player.x, player.y, 18, player.x, player.y, 110);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.94)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // Popups
    for (const p of popups) {
      ctx.fillStyle = `rgba(255,240,180,${Math.min(1, p.life * 1.2)})`;
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    }

    // HUD
    drawHUD();

    // Intro instruction
    if (gameTime < 7) {
      const a = Math.min(1, 7 - gameTime);
      ctx.fillStyle = `rgba(255,255,255,${a*0.85})`;
      ctx.font = '13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Check all doors · Move: WASD / Arrows · Shift: sprint · F: flashlight · T: toss dog treat', W/2, H - 18);
    }

    // Victory
    if (victory) {
      ctx.fillStyle = 'rgba(0,0,0,0.82)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffe066';
      ctx.font = 'bold 42px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('All doors checked!', W/2, H/2 - 18);
      ctx.fillStyle = '#ffffff';
      ctx.font = '22px system-ui, sans-serif';
      ctx.fillText('Shift complete.', W/2, H/2 + 22);
      ctx.fillStyle = '#c8c8c8';
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillText('Press R to restart', W/2, H/2 + 64);
    }
  }

  function drawHUD() {
    const remaining = doors.filter(d => !d.checked).length;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(10, 10, 190, 88);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeRect(10.5, 10.5, 189, 87);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Doors: ' + (4 - remaining) + ' / 4', 20, 32);

    // stamina bar
    ctx.fillStyle = '#222';
    ctx.fillRect(20, 42, 160, 8);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(20, 42, 160 * (player.stamina/100), 8);

    ctx.fillStyle = '#bdbdbd';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('Light: ' + (flashlightOn ? 'ON' : 'OFF') + ' · Stamina', 20, 66);
    ctx.fillText('[T] toss treat for dog 🐕', 20, 82);

    // Door checklist
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(W-120, 10, 110, 104);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeRect(W-119.5, 10.5, 109, 103);
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Rounds', W-110, 28);
    for (let i = 0; i < doors.length; i++) {
      const d = doors[i];
      const y = 48 + i*14;
      ctx.fillStyle = d.checked ? '#6ee06e' : '#ff6060';
      ctx.beginPath(); ctx.arc(W-104, y-4, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = d.checked ? '#cfe9cf' : '#e9cfcf';
      ctx.fillText('Door ' + (i+1) + (d.checked ? ' ✓' : (d.progress>0 ? ' checking...' : '')), W-95, y);
    }
  }

  function drawDecor(d) {
    if (d.kind === 'desk') {
      ctx.fillStyle = '#4a3620';
      ctx.fillRect(d.x-20, d.y-14, 40, 28);
      ctx.strokeStyle = '#2a1c0c';
      ctx.lineWidth = 1;
      ctx.strokeRect(d.x-20, d.y-14, 40, 28);
      ctx.fillStyle = '#6b4a2a';
      ctx.fillRect(d.x-18, d.y-12, 36, 3);
    } else if (d.kind === 'plant') {
      ctx.fillStyle = '#4a3620';
      ctx.fillRect(d.x-7, d.y+6, 14, 10);
      ctx.fillStyle = '#275a2a';
      ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#3b7a3a';
      ctx.beginPath(); ctx.arc(d.x-4, d.y-3, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(d.x+5, d.y-1, 4, 0, Math.PI*2); ctx.fill();
    } else if (d.kind === 'crate') {
      ctx.fillStyle = '#5a3f1e';
      ctx.fillRect(d.x-14, d.y-14, 28, 28);
      ctx.strokeStyle = '#2a1c0c';
      ctx.lineWidth = 1;
      ctx.strokeRect(d.x-14, d.y-14, 28, 28);
      ctx.beginPath();
      ctx.moveTo(d.x-14, d.y); ctx.lineTo(d.x+14, d.y);
      ctx.moveTo(d.x, d.y-14); ctx.lineTo(d.x, d.y+14);
      ctx.stroke();
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
